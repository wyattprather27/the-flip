  <g fill="#fdfcf9">
    <rect x="110" y="200" width="60" height="14"/>
    <rect x="110" y="224" width="60" height="14"/>
    <rect x="110" y="248" width="60" height="14"/>
    <rect x="110" y="272" width="60" height="14"/>
    <rect x="110" y="296" width="60" height="14"/>
    <rect x="190" y="200" width="60" height="14"/>
